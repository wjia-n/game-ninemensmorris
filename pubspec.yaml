name: ninemensmorris
description: Nine Men's Morris by Wajiha - 100% free fun game.
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.6
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/fonts/

  fonts:
    - family: StoneSerif
      fonts:
        - asset: assets/fonts/DejaVuSerif.ttf
        - asset: assets/fonts/DejaVuSerif-Bold.ttf
          weight: 700
